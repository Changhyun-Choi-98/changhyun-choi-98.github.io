<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#05080d">
  <title>참가자 화면 · 이미지 공개 퀴즈</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="display-page">
  <main class="display-shell">
    <div class="display-topline">
      <span id="displayConnection" class="state-badge" role="status" aria-live="polite">진행자 연결 중</span>
      <span id="displayRound">0 / 0 라운드</span>
      <button id="displayFullscreen" type="button" class="compact-button">전체화면</button>
    </div>
    <div class="display-canvas-wrap"><canvas id="displayCanvas" aria-label="참가자용 공개 이미지"></canvas></div>
    <div class="display-timer"><span>현재 이미지</span><strong id="displayTimer">00:00.0</strong></div>
    <p id="displayNotice" class="display-notice" role="status" aria-live="polite">진행자 화면의 최신 상태를 기다리고 있습니다.</p>
  </main>
  <script src="js/domain.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
