<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b1220">
  <title>랭킹 보드 · 이미지 공개 퀴즈</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="leaderboard-page">
  <main class="leaderboard-shell">
    <header class="leaderboard-header">
      <div><p class="eyebrow">이미지 공개 퀴즈</p><h1>랭킹 보드</h1></div>
      <div class="leaderboard-header-actions"><span id="leaderboardStorage" class="status-pill">저장소 연결 중</span><button id="leaderboardFullscreen" type="button" class="compact-button">전체화면</button></div>
    </header>
    <section class="podium" id="podium" aria-label="상위 3위"></section>
    <div class="leaderboard-table-wrap">
      <table class="ranking-table leaderboard-table">
        <caption class="visually-hidden">전체 팀 랭킹</caption>
        <thead><tr><th scope="col">순위</th><th scope="col">팀명</th><th scope="col">정답</th><th scope="col">소요 시간</th></tr></thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
      <p id="leaderboardEmpty" class="empty-table">진행자 화면에서 팀을 등록해 주세요.</p>
    </div>
  </main>
  <script src="js/domain.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/persistence.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/leaderboard.js"></script>
</body>
</html>
